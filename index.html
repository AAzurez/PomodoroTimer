<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Pomodoro Timer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="app">
      <p>Pomodoro Timer</p>

      <div class = "timer-container">
        <svg width = "75" height = "75" viewBox = "0 0 220 120">

          <!-- Background arc -->
        <path
          id="bgArc"
          d="M 20 100 A 90 90 0 0 1 200 100"
          stroke="#ddd"
          stroke-width="10"
          fill="none"
        />

        <!-- Progress arc -->
        <path
          id="progressArc"
          d="M 20 100 A 90 90 0 0 1 200 100"
          stroke="red"
          stroke-width="10"
          fill="none"
          stroke-linecap="round"
        />

      </svg>

      <p id = "timer">25:00</p>
      <div class = "button-container">
      <button id="startButton" onclick = "toggleTimer()">Start</button>
      <button id="restartButton" onclick = "restartTimer()">Restart </button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
